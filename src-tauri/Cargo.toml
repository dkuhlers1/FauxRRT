[package]
name = "fauxrrt"
version = "0.1.0"
description = "Desktop trajectory viewer with an embedded Cesium globe"
authors = ["FauxRRT"]
edition = "2021"

[lib]
name = "fauxrrt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-core = "0.61"
rayon = "1"
walkdir = "2"
rustfft = "6"
ureq = { version = "2.12", features = ["json"] }
